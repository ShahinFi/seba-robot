<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEBA Tuner</title>
  <link rel="stylesheet" href="/apps/tuner/styles.css">
</head>
<body>
  <header>
    <div class="header-title">
      <div class="title-row">
        <h1>SEBA Live Tuner</h1>
        <div class="subline">
          <span id="connection" class="chip muted">connecting</span>
          <span id="mode" class="chip muted">stopped</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <button id="logout" class="auth-logout hidden">Logout</button>
    </div>
  </header>

  <main>
    <div class="panel-stack controls-stack">
      <section class="run-section">
        <h2>Run Control</h2>
        <div class="toolbar">
          <button id="balance_start" class="primary">Start Balance</button>
          <button id="balance_stop">Stop Balance</button>
          <button id="system_reset" class="danger full">Hold to Reset STM32</button>
        </div>
      </section>

      <section class="motion-section">
        <h2>Motion Control</h2>
        <div class="command-panel">
          <div class="motion-subsection">
            <h3>Joystick</h3>
            <div id="joystick" class="joystick" aria-label="Motion joystick">
              <div id="joystick_knob" class="joystick-knob"></div>
            </div>
            <div class="grid">
              <label>Max drive speed [m/s]
                <input id="drive_speed" type="number" min="0" max="2" step="0.01" value="0.1">
              </label>
              <label>Max turn speed [rad/s]
                <input id="turn_speed" type="number" min="0" max="6" step="0.01" value="0.6">
              </label>
            </div>
          </div>

          <div class="motion-subsection">
            <h3>Direct Command</h3>
            <div class="grid">
              <label>Forward velocity [m/s]
                <input id="v_cmd" type="number" min="-2" max="2" step="0.01" value="0">
              </label>
              <label>Yaw rate [rad/s]
                <input id="yaw_cmd" type="number" min="-6" max="6" step="0.01" value="0">
              </label>
              <button id="apply_motion" class="full">Apply Motion Command</button>
              <button id="motion_stop" class="danger full">Stop Motion</button>
            </div>
          </div>
        </div>
      </section>

    </div>

    <div class="panel-stack tuning-stack">
      <section class="actuator-section">
        <h2>Actuator Loop Settings</h2>
        <div class="actuator-settings">
          <label>Kp [mV/A]
            <input id="act_kp" type="number" min="0" max="100000" step="100" value="3000">
          </label>
          <label>Ki [mV/(A*s)]
            <input id="act_ki" type="number" min="0" max="100000" step="100" value="0">
          </label>
          <label>Max current [mA]
            <input id="act_max_current" type="number" min="0" max="10000" step="50" value="5000">
          </label>
          <label>Max PWM [%]
            <input id="act_max_pwm" type="number" min="0" max="100" step="1" value="100">
          </label>
          <label>Integral limit [mV]
            <input id="act_integral" type="number" min="0" max="20000" step="100" value="3000">
          </label>
          <label>Torque constant [mNm/A]
            <input id="act_ktw" type="number" min="1" max="10000" step="10" value="260">
          </label>
          <button id="apply_actuator_settings" class="panel-action full">Apply Actuator Control Settings</button>
        </div>
      </section>

      <section class="balance-section">
        <h2>Balance Loop Settings</h2>
        <div class="balance-settings">
          <label>Gain scale [%]
            <input id="gain_scale" type="number" min="0" max="10000" step="1" value="100">
          </label>
          <label>Max torque [mNm]
            <input id="max_torque" type="number" min="0" max="10000" step="10" value="1300">
          </label>
        </div>
        <div class="section-spacer"></div>
        <h3>RSLQR Gain Matrix</h3>
        <div class="matrix" id="gain_matrix"></div>
        <div class="section-spacer"></div>
        <button id="apply_balance_loop" class="panel-action">Apply Balance Control Settings</button>
      </section>

      <div class="log-stack">
        <details class="log-panel" open>
          <summary>Command Log</summary>
          <div id="command_log" class="log"></div>
        </details>

        <details class="log-panel" open>
          <summary>STM Log</summary>
          <div id="stm_log" class="log"></div>
        </details>
      </div>
    </div>

    <div class="panel-stack telemetry-stack">
      <section class="telemetry-section">
        <h2>Telemetry</h2>
        <div class="readout" id="readout"></div>
      </section>
    </div>
  </main>

  <div id="auth_overlay" class="auth-overlay hidden">
    <form id="auth_form" class="auth-card">
      <h2>Unlock Tuner</h2>
      <p id="auth_message">Engineer access is required.</p>
      <input id="auth_role" type="hidden" value="engineer">
      <label>Password
        <input id="auth_password" type="password" autocomplete="current-password">
      </label>
      <button class="primary" type="submit">Unlock</button>
    </form>
  </div>

  <script src="/apps/tuner/app.js" defer></script>
</body>
</html>
